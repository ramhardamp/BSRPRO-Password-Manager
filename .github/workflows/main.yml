name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract project from ZIP
        run: |
          unzip -o bsrpro-vault-phase1-2.zip -d project
          ls -la project/
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      
      - name: Build APK
        working-directory: project
        run: |
          echo "=== Project structure ==="
          find . -maxdepth 2 -type f -name "*.gradle*" -o -name "gradlew*" | head -20
          echo "=== Building ==="
          gradle assembleDebug --stacktrace --no-daemon
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsrpro-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: project/app/build/reports/
          retention-days: 30
