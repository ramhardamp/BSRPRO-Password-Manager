name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract project from ZIP
        run: |
          unzip -o bsrpro-vault-phase1-2.zip -d project
          cd project
          echo "=== Files in root ==="
          ls -la
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls -la $ANDROID_SDK_ROOT
      
      - name: Create local.properties
        working-directory: project
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      
      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace --no-daemon --info 2>&1 | tail -200
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsrpro-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
